name = "gjakova-run-club"
main = "src/index.ts"
compatibility_date = "2026-11-06"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "gjakova-run-club-members"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
CLUB_EMAIL = "gjakovarunclub@gmail.com"
